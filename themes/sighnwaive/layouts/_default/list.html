{{ define "main" }}
<section class="posts-list">
  <h2>{{ if .Title }}{{ .Title }}{{ else }}All Posts{{ end }}</h2>
  {{ range .Pages }}
  <article class="post-item">
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <div class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</div>
  </article>
  {{ end }}
</section>
{{ end }}
