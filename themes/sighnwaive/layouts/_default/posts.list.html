{{ define "main" }}
<section class="hero">
  <h1>{{ .Title }}</h1>
</section>

<section class="posts-list">
  {{ range .Pages }}
  <article class="post-item">
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <div class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</div>
  </article>
  {{ end }}
</section>
{{ end }}
